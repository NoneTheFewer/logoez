<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 24 24">
	<style>
		.pixel {
			fill: url(#logo-gradient)
		}
	</style>
	<linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%" data-astro-cid-tvrurpns="">
		<stop offset="0%" data-astro-cid-tvrurpns="" stop-color=" #4f46e5"/>
		<stop offset="100%" data-astro-cid-tvrurpns="" stop-color=" #9333ea"/>
	</linearGradient>
	<g class="pixels" data-astro-cid-tvrurpns="">
		<rect x="4" y="4" width="8" height="8" class="pixel" data-astro-cid-tvrurpns=""/>
		<rect x="20" y="4" width="8" height="8" class="pixel" data-astro-cid-tvrurpns=""/>
		<rect x="12" y="12" width="8" height="8" class="pixel animate-pulse" data-astro-cid-tvrurpns=""/>
		<rect x="4" y="20" width="8" height="8" class="pixel" data-astro-cid-tvrurpns=""/>
		<rect x="20" y="20" width="8" height="8" class="pixel" data-astro-cid-tvrurpns=""/>
	</g>
</svg>