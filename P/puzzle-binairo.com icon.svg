<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 121 121">
	<defs>
		<g id="black">
			<rect x=".5" y=".5" width="20" height="20" fill="none" stroke="grey" stroke-width="1"/>
			<circle cx="10.5" cy="10.5" r="8.5" fill="black" stroke="black" stroke-width="1"/>
		</g>
		<g id="blackdot">
			<rect x=".5" y=".5" width="20" height="20" fill="none" stroke="grey" stroke-width="1"/>
