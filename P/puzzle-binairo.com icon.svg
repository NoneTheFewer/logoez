			<circle cx="10.5" cy="10.5" r="1" fill="grey"/>
		</g>
		<g id="white">
			<rect x=".5" y=".5" width="20" height="20" fill="none" stroke="grey" stroke-width="1"/>
			<circle cx="10.5" cy="10.5" r="8.5" fill="white" stroke="black" stroke-width="1"/>
		</g>
		<g id="whitedot">
			<rect x=".5" y=".5" width="20" height="20" fill="none" stroke="grey" stroke-width="1"/>
			<circle cx="10.5" cy="10.5" r="8.5" fill="white" stroke="black" stroke-width="1"/>
			<circle cx="10.5" cy="10.5" r="1" fill="grey"/>
		</g>
	</defs>
	<rect fill="white" width="100%" height="100%"/>
	<use href="#black" x="0" y="0"/>
	<use href="#white" x="20" y="0"/>
