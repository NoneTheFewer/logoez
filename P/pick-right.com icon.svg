<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<defs>
		<!-- Hero-matching gradient: same colors as the site's main hero band so
         the favicon ↔ header logo ↔ OG card ↔ hero form one cohesive system. -->
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0f3a26"/>
			<stop offset="100%" stop-color="#15803d"/>
		</linearGradient>
	</defs>
	<!-- Editorial green rounded square. Says approved/verified. -->
	<rect width="100" height="100" rx="22" fill="url(#bg)"/>
	<!-- Crisp white checkmark. High contrast at every size, including 16×16
       favicon rendering. Matches the site's modern Inter-based clean
       aesthetic better than the previous warm cream + decorative dot. -->
	<path d="M 24 52 L 42 70 L 76 30" stroke="#ffffff" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>