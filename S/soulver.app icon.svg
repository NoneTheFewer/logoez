<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
	<!-- Paths vectorised from the iOS source icon via Quiver, then
           regrouped so the 4 calculator buttons sit in <g class="ai-btn">
           wrappers and animate in independently on page load. -->
	<defs>
		<linearGradient id="ai-tab-shadow" x1="64" x2="64" y1="35.5" y2="31.42" gradientUnits="userSpaceOnUse">
			<stop stop-opacity="0" offset="0"/>
			<stop stop-opacity=".1" offset="1"/>
		</linearGradient>
		<linearGradient id="ai-tab" x1="64" x2="64" y1="31.5" gradientUnits="userSpaceOnUse">
			<stop stop-color="#FDC103" offset="0"/>
			<stop stop-color="#FEE06F" offset="1"/>
		</linearGradient>
		<linearGradient id="ai-red" x1="15.01" x2="52.81" y1="74.99" y2="37.19" gradientUnits="userSpaceOnUse">
			<stop stop-color="#F54E56" offset="0"/>
			<stop stop-color="#F55258" offset="1"/>
		</linearGradient>
		<linearGradient id="ai-grn" x1="77.16" x2="109.7" y1="75.16" y2="42.58" gradientUnits="userSpaceOnUse">
			<stop stop-color="#49CC52" offset="0"/>
			<stop stop-color="#58DD68" offset="1"/>
		</linearGradient>
		<linearGradient id="ai-pur" x1="16.98" x2="49.81" y1="118.1" y2="85.25" gradientUnits="userSpaceOnUse">
			<stop stop-color="#A568CD" offset="0"/>
			<stop stop-color="#AC78DC" offset="1"/>
		</linearGradient>
		<linearGradient id="ai-blu" x1="79.11" x2="108.8" y1="119.9" y2="84.15" gradientUnits="userSpaceOnUse">
			<stop stop-color="#56ABFA" offset="0"/>
			<stop stop-color="#56B5FD" offset="1"/>
		</linearGradient>
	</defs>
	<!-- white paper squircle (drawn behind everything) -->
	<rect class="ai-paper" x="0" y="0" width="128" height="128" rx="28" fill="#FFFFFF"/>
	<!-- soft shadow band where the yellow tab meets the paper -->
	<rect class="ai-tab-shadow" y="31.4" width="128" height="4.1" fill="url(#ai-tab-shadow)"/>
	<!-- yellow notepad tab — top corners curve to match the icon's
           outer squircle (rx=28); bottom is straight where it meets the
           white paper below. -->
	<path class="ai-tab" d="M 0 31.5 L 0 28 A 28 28 0 0 1 28 0 L 100 0 A 28 28 0 0 1 128 28 L 128 31.5 Z" fill="url(#ai-tab)"/>
